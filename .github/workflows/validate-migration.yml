name: Validate source baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required source files
        shell: bash
        run: |
          set -euo pipefail

          test -s qualityops.html
          test -s assets/css/qualityops-design-system.css

          expected="6a5efd05a2d0008a8ef30de720ee0e846c3d7d662bfc9a1e60302b341e0ee54a"
          actual="$(sha256sum qualityops.html | cut -d' ' -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error file=qualityops.html::SHA-256 mismatch: expected $expected, got $actual"
            exit 1
          fi

          if find . -path './.git' -prune -o -path './.import/*' -print -quit | grep -q .; then
            echo "::error::.import contains temporary migration fragments"
            exit 1
          fi

      - name: Check source for temporary routes
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '/tmp/|localhost|chatgpt\.com|openai\.com|sandbox:' qualityops.html; then
            echo "::error file=qualityops.html::Temporary or development route detected"
            exit 1
          fi
