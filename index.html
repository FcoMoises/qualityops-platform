<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06182B"><title>QualityOps</title></head><body><noscript>QualityOps necesita JavaScript.</noscript><div id="loader" style="min-height:100vh;display:grid;place-items:center;font:16px Inter,Arial;background:#fff;color:#061a38">Cargando QualityOps…</div><script>
(async()=>{try{
const files=['1','2','3','4a','4b','5','6'];
const get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u+' HTTP '+r.status);return r.text()};
const [base,...parts]=await Promise.all([get('qualityops.html'),...files.map(x=>get('assets/assessment/engine-v09-'+x+'.txt'))]);
const b=atob(parts.join('').replace(/\s/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
if(typeof DecompressionStream!=='function')throw Error('Safari necesita una versión actualizada para ejecutar la evaluación.');
const engine=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
if(!engine.includes("const ASSESSMENT_VERSION='ISO9001-2026-v0.9'")||!engine.includes('"id":"Q60"'))throw Error('Motor de 60 preguntas incompleto.');
let h=base.replace('class="app appHidden" id="appRoot"','class="app appHidden qo-app" id="appRoot"').replace('content="#07111d" name="theme-color"','content="#06182B" name="theme-color"');
h=h.replace(/data-home-areas="\d+"/,'data-home-areas="7"').replace(/data-home-checks="\d+"/,'data-home-checks="60"').replace(/data-home-duration="[^"]*"/,'data-home-duration="≈ 10–15 min"').replace(/18 preguntas/g,'60 preguntas').replace(/64 preguntas/g,'60 preguntas').replace(/6 áreas/g,'7 áreas').replace(/11 áreas/g,'7 áreas').replace(/≈ 8 min/g,'≈ 10–15 min');
h=h.replace('<h3 id="methodDemoQuestionTitle" data-demo-question-id="P6"></h3>','<div id="methodDemoStepLabel" style="font-size:12px;font-weight:800;color:#087fe5;margin-bottom:8px">Control 1 de 3</div><h3 id="methodDemoQuestionTitle" data-demo-question-id="Q17"></h3>');
h=h.replace(/(<fieldset class="methodDemoOptionsV2" id="methodDemoOptionsV2">[\s\S]*?<\/fieldset>)/,'$1<div style="display:flex;gap:10px;justify-content:space-between;margin-top:14px"><button class="publicSecondary" id="methodDemoPrevBtn" type="button">← Anterior</button><button class="publicPrimary" id="methodDemoNextBtn" type="button">Siguiente control →</button></div>');
const add=`<section id="qoEvidenceAssessment" hidden style="margin-top:18px;padding:16px;border:1px solid #dce7f2;border-radius:14px;background:#fff"><strong>Evidencia objetiva</strong><p style="color:#60758a">¿Qué nivel de evidencia dispone para demostrar esta situación?</p><div id="evidenceOptions"></div></section><section id="qoNaAssessment" hidden style="margin-top:18px;padding:16px;border:1px solid #dce7f2;border-radius:14px;background:#fff"><label for="naJustification"><strong>Justificación de “No aplica”</strong></label><textarea id="naJustification" rows="3" maxlength="800" style="width:100%;margin-top:8px"></textarea><small id="naCharCount">0 / 20 caracteres mínimos</small></section><section id="qoConditionalAssessment" hidden style="margin-top:18px;padding:16px;border:1px solid #dce7f2;border-radius:14px;background:#fff"><strong>Información complementaria</strong><div id="conditionalQuestions"></div></section>`;
if(!h.includes('id="qoEvidenceAssessment"'))h=h.replace(/(<div class="options" id="options"><\/div>\s*<\/fieldset>)/,'$1'+add);
const s=h.indexOf('const questionUX='),e=s>=0?h.indexOf('<\/script>',s):-1;if(s<0||e<0)throw Error('No se localizó el motor antiguo.');h=h.slice(0,s)+engine+'\n'+h.slice(e);
const css=`<style>html,body,#appRoot.qo-app,#appRoot.qo-app .shell,#appRoot.qo-app .main,#appRoot.qo-app .screen{background:#fff!important;color-scheme:light!important}.qoEvidenceOption{display:flex;gap:10px;padding:12px;margin:8px 0;border:1px solid #dce7f2;border-radius:10px;background:#fff}.qoEvidenceOption.selected{border-color:#087fe5;background:#eef6ff}#conditionalQuestions{display:grid;gap:10px;margin-top:10px}.qoConditionalField{display:grid;gap:5px}.qoConditionalField input,.qoConditionalField select,#naJustification{border:1px solid #cbdbea;border-radius:9px;padding:10px;background:#fff;color:#0b2945}</style>`;h=h.replace('</head>',css+'</head>');document.open();document.write(h);document.close();
}catch(e){console.error(e);document.body.innerHTML='<main style="padding:28px;font:16px Inter,Arial;color:#061a38"><h1>QualityOps</h1><p>No se pudo cargar la evaluación.</p><pre>'+String(e.message||e)+'</pre></main>'}})();
</script></body></html>
